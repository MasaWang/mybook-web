<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manuscript Revision Studio</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div><strong>MANUSCRIPT REVISION STUDIO</strong><span>書稿修訂工作台 · LOCAL</span></div>
      <div class="topbar-actions"><div id="save-state" class="status">尚未選擇文件</div><button id="review-toggle" class="review-toggle" type="button" aria-expanded="true" aria-controls="review-content" aria-label="收合右側審查欄"><span aria-hidden="true">→</span><strong>收合</strong></button></div>
    </header>
    <main class="workspace">
      <aside class="files-panel">
        <div class="panel-heading"><span>MANUSCRIPT</span><input id="file-filter" type="search" placeholder="搜尋章節" /></div>
        <nav id="file-list" aria-label="書稿文件"></nav>
      </aside>

      <section class="editor-panel">
        <div class="document-heading">
          <div><small id="document-path">SELECT A DOCUMENT</small><h1 id="document-title">選擇左側章節開始修訂</h1><p class="workflow-label">ENGLISH SOURCE → 中文修訂 → ENGLISH REWRITE</p></div>
          <div class="document-controls">
            <label class="language-control" for="language-filter">稿件語言
              <select id="language-filter" disabled>
                <option value="all">全部</option>
                <option value="en">English</option>
                <option value="zh-TW">繁體中文</option>
              </select>
            </label>
            <div class="progress"><span id="progress-label">0 / 0</span><progress id="progress" value="0" max="1"></progress></div>
          </div>
        </div>
        <div id="segment-list" class="segment-list"><p class="empty">正式書稿保持唯讀；所有接受的變更只會另存到「智慧之海修訂」。</p></div>
      </section>

      <aside class="review-panel">
        <div id="review-content" class="review-content">
        <section>
          <small>SELECTED SEGMENT</small>
          <h2 id="segment-id">—</h2>
          <div class="meta"><span id="segment-language">—</span><span id="segment-kind">—</span></div>
        </section>
        <section>
          <small>PROTECTED TERMINOLOGY</small>
          <div id="term-list" class="term-list"></div>
        </section>
        <section class="save-box">
          <label class="confirmation"><input id="confirm-terms" type="checkbox" />我已核對受保護術語變動</label>
          <button id="save-draft" class="primary" disabled>另存修訂稿</button>
          <p id="save-result"></p>
        </section>
        </div>
      </aside>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
